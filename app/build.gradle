plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services' // Firebase 초기화
}

android {
    namespace 'com.example.capstonedesign'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.capstonedesign"
        minSdk 26 // 원래는 35
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    // Firebase SDK (최신 BOM 기준)
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'

    // 둥근 모서리와 그림자 효과를 주는 CardView 위젯을 사용하기 위해 추가
    implementation("androidx.cardview:cardview:1.0.0")

    // RecyclerView 라이브러리: 스크롤 가능한 목록을 만들기 위한 필수 부품
    implementation("androidx.recyclerview:recyclerview:1.3.2")

    // Material 디자인 컴포넌트 라이브러리 (버튼, 카드 등 다양한 UI 제공)
    implementation("com.google.android.material:material:1.10.0")

    // Firestore 추가
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'

    // Glide 설치 및 이미지 추가
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // FCM 푸시 메시징
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-inappmessaging-display'

    // Google Maps & Location
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // OkHttp: 네트워크 통신을 위한 HTTP/HTTPS 클라이언트 라이브러리
    implementation "com.squareup.okhttp3:okhttp:4.9.3"

    // Jetpack 기본 라이브러리
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // 테스트 라이브러리
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'com.google.firebase:firebase-functions:20.3.0'
    implementation 'com.google.firebase:firebase-auth:22.3.0'
}